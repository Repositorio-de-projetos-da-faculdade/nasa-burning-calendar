[project]
name = "firecal"
version = "0.1.0"
description = "Calendario harmonizado de focos de calor (MODIS + VIIRS) para a Amazonia"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "duckdb>=1.1",
    "pyarrow>=18",
    "polars>=1.12",
    "numpy>=2.1",
    "scipy>=1.14",
    "shapely>=2.0",
    "h3>=4.1",
    "httpx>=0.27",
    "pydantic-settings>=2.6",
    "typer>=0.13",
    "tqdm>=4.66",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[project.scripts]
firecal = "pipeline.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "pipeline"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # typer.Option em defaults e idiomatico

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
